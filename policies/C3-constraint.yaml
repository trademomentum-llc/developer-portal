---
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: c3infracostdelta
spec:
  crd:
    spec:
      names: { kind: C3InfracostDelta }
      validation:
        openAPIV3Schema:
          type: object
          properties:
            thresholdUSD:
              type: string
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package constraints.m2.c3

        violation[{"msg": msg}] {
          input.review.kind.kind == "Component"
          delta_str := input.review.object.metadata.annotations["pipeline.m2/cost-delta-usd"]
          delta := to_number(delta_str)
          threshold := to_number(input.parameters.thresholdUSD)
          delta > threshold
          msg := sprintf("estimated monthly cost delta $%v exceeds threshold $%v", [delta, threshold])
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: C3InfracostDelta
metadata:
  name: c3-enforce
spec:
  match:
    kinds:
      - apiGroups: ["core.choreo.dev"]
        kinds: ["Component"]
  parameters:
    thresholdUSD: "50"
