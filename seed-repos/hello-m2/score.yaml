apiVersion: score.dev/v1b1
metadata:
  name: hello-m2
  annotations:
    pipeline.m2/owner: openchoreo
containers:
  web:
    image: gitea.gitea.svc.cluster.local:3000/openchoreo/hello-m2:latest
    variables:
      ENVIRONMENT: "${resources.env.value}"
      EXAMPLE_SECRET: "${resources.example.password}"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
service:
  ports:
    http:
      port: 8080
resources:
  env:
    type: environment
  example:
    type: secret
    metadata:
      name: example-secret
