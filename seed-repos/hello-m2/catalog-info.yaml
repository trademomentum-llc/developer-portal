apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hello-m2
  description: M2 demo workload (Score -> OpenChoreo via score2openchoreo)
  annotations:
    gitea.io/project: openchoreo/hello-m2
    openchoreo.dev/project: default
    openchoreo.dev/component: hello-m2
    openchoreo.dev/environment: development
    # Runtime namespace is auto-generated by OpenChoreo:
    # dp-{controlNs}-{project}-{environment}-{hash} using the algorithm in
    # openchoreo/internal/dataplane/kubernetes/name.go.
    # Deterministic predictor: tools/namespace-predictor/main.go
    openchoreo.dev/runtime-namespace-template: dp-default-default-development-*
    # FR-19: Backstage kubernetes plugin discovery. Dataplane pods carry the
    # label openchoreo.dev/component=<name> (set by OpenChoreo), so the label
    # selector below lets the plugin's workload view (mounted as a section on
    # the entity's Deployment tab) list this component's live objects through
    # the localKubectlProxy cluster locator.
    backstage.io/kubernetes-label-selector: openchoreo.dev/component=hello-m2
  links:
    - url: http://localhost:3333/openchoreo/hello-m2
      title: Gitea repo
      icon: web
    - url: http://localhost:3333/openchoreo/hello-m2/actions
      title: CI runs
      icon: dashboard
    - url: http://localhost:9090
      title: OpenChoreo API (Component + ReleaseBinding status)
      icon: dashboard
spec:
  type: service
  lifecycle: experimental
  owner: openchoreo
  system: developer-portal
