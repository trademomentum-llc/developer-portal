# Keep GitHub in sync with the Gitea source of truth.
# Gitea: https://gitea.com/trademomentum.net/developer-portal
# GitHub is the Vercel-facing mirror; this workflow is the pull side.
#
# gitea.com has the server Mirror feature disabled (push/pull mirrors
# return HTTP 400 "Mirror feature is disabled"), so native Gitea push
# mirrors cannot be used there. This Action is the automatic path:
#   - schedule: every 5 minutes
#   - workflow_dispatch: manual
#   - repository_dispatch type gitea-push: optional near-instant trigger
#     from a Gitea webhook (see scripts/setup-gitea-github-dispatch-webhook.sh)

name: Sync from Gitea

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [gitea-push]

concurrency:
  group: sync-from-gitea
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # GitHub-only job: Gitea also reads .github/workflows, but on Gitea
    # secrets.GITHUB_TOKEN is a Gitea-scoped token that cannot write to
    # github.com, so gitea-side runs are waste. Skip them at the source.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror branches and tags from Gitea
        env:
          SRC: https://gitea.com/trademomentum.net/developer-portal.git
          # Same-repo write token provided by Actions
          DST: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/trademomentum-llc/developer-portal.git
        run: |
          set -euo pipefail

          git version
          git clone --mirror "${SRC}" gitea.git
          cd gitea.git

          # Point origin at GitHub and push all fetched refs.
          # Explicit branch/tag refspecs with --prune (NOT --mirror):
          # gitea.com exposes refs/pull/* and GitHub rejects those as
          # hidden refs, which made every --mirror push fail wholesale.
          # --prune keeps branches/tags exact: refs deleted on Gitea are
          # pruned on GitHub. The clone --mirror config flag must be
          # unset first: git refuses to combine it with refspecs.
          git remote set-url origin "${DST}"
          git config --unset remote.origin.mirror || true

          before="$(git ls-remote origin HEAD | awk '{print $1}')"
          git push origin --prune '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
          after="$(git ls-remote origin HEAD | awk '{print $1}')"

          echo "GitHub HEAD before: ${before:-none}"
          echo "GitHub HEAD after:  ${after:-none}"
          if [ "${before:-}" = "${after:-}" ]; then
            echo "Already up to date with Gitea."
          else
            echo "GitHub updated from Gitea."
          fi
