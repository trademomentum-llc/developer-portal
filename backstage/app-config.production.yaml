# Production configuration template for Backstage.
# Values are read from environment variables so secrets never live in git.
# Load this file in production by setting NODE_ENV=production or passing
# --config app-config.yaml --config app-config.production.yaml to the backend.
app:
  baseUrl: ${APP_BASE_URL}

backend:
  baseUrl: ${BACKEND_BASE_URL}
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DATABASE:-backstage_plugin_db}

auth:
  # Production disables the guest provider. Replace with a real IdP such as
  # Gitea OIDC, GitHub, GitLab, or OIDC once one is provisioned.
  providers: {}

permission:
  enabled: true
