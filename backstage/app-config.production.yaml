# Production configuration template for Backstage.
# Values are read from environment variables so secrets never live in git.
# Load this file in production by setting NODE_ENV=production or passing
# --config app-config.yaml --config app-config.production.yaml to the backend.
app:
  baseUrl: ${APP_BASE_URL}
  extensions:
    # Disable the default Backstage sign-in page so the custom Gitea page
    # from giteaSignInModule is rendered. The config key matches the legacy
    # extension id; Backstage logs an INVALID_EXTENSION_CONFIG_KEY warning
    # in this frontend-system version, but the override still works.
    - app/sign-in-page: false

backend:
  baseUrl: ${BACKEND_BASE_URL}
  auth:
    keys:
      - secret: ${BACKEND_SECRET}
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DATABASE:-backstage_plugin_db}

auth:
  environment: production
  # Production disables the guest provider.
  providers:
    gitea:
      production:
        clientId: ${GITEA_OAUTH_CLIENT_ID}
        clientSecret: ${GITEA_OAUTH_CLIENT_SECRET}
        hostname: ${GITEA_HOSTNAME}
        secure: true

permission:
  enabled: true
  policy:
    # Admin role membership (SEC-PLANE-WAVE0-TECH-001 section 8). The deployer
    # signs in through the Gitea OAuth flow, which issues
    # user:default/<login> claims (giteaAuth.ts); the deployer login is
    # gitea_admin. Override with BACKSTAGE_ADMIN_USERS (a single login).
    adminUsers: ["${BACKSTAGE_ADMIN_USERS:-gitea_admin}"]
