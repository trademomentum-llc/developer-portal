# values.local.yaml
# Minimal, demo-safe configuration for SigNoz on local k3d / Colima.
# This is the reference values file consumed by install-m3.sh.
#
# IMPORTANT: This configuration deliberately uses reduced resources and
# single-replica components. It is NOT suitable for production or
# high-cardinality workloads. Use only for M3 development and demonstration.
#
# Coexistence note: This stack lives in the `signoz` namespace and must
# never be installed into openchoreo-observability-plane.

global:
  storageClass: ""   # Let preflight and cluster decide (usually standard or local-path)

clickhouse:
  enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1
      memory: 2Gi
  persistence:
    # FR-10 (OQ-06): local-path PVC so ClickHouse restarts stop wiping telemetry.
    enabled: true
    size: 2Gi
    storageClass: local-path

zookeeper:
  enabled: false     # Single-node ClickHouse for demo

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP

queryService:
  replicaCount: 1
  resources:
    requests:
      cpu: 200m
      memory: 512Mi

alertmanager:
  enabled: false     # Can be enabled later for policy-driven alerts

otelCollector:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

# Reduce sampling and retention for local laptop / CI friendliness
# FR-10 (OQ-06): retention is CONFIGURABLE here but is NOT a native chart key;
# scripts/install-m3.sh reconciles these values onto the live instance through
# the SigNoz TTL API (POST /api/v1/settings/ttl) after the helm upgrade.
signoz:
  otel:
    sampling:
      enabled: true
      samplingRatio: 0.1
  retention:
    traces: 3d
    logs: 3d
    metrics: 7d

# Explicit labeling so humans and future automation can distinguish M3 resources
commonLabels:
  app.kubernetes.io/part-of: "m3-production-visibility"
  openchoreo.dev/managed-by: "developer-portal-m3"