apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
    name: minimal
    namespace: default
spec:
    owner:
        projectName: default
    autoDeploy: true
    componentType:
        kind: ClusterComponentType
        name: deployment/worker
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
    name: minimal-workload
    namespace: default
spec:
    owner:
        componentName: minimal
        projectName: default
    container:
        image: registry.example.com/minimal:1
