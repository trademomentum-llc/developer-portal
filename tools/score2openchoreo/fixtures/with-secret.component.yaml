apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
    name: with-secret
    namespace: default
spec:
    owner:
        projectName: default
    autoDeploy: true
    componentType:
        kind: ClusterComponentType
        name: deployment/worker
---
apiVersion: openchoreo.dev/v1alpha1
kind: SecretReference
metadata:
    name: example-secret
    namespace: default
spec:
    template:
        type: Opaque
    data:
        - secretKey: password
          remoteRef:
            key: apps/with-secret/dev/example-secret
            property: password
    refreshInterval: 1h
---
apiVersion: openchoreo.dev/v1alpha1
kind: Workload
metadata:
    name: with-secret-workload
    namespace: default
spec:
    owner:
        componentName: with-secret
        projectName: default
    container:
        image: registry.example.com/ws:1
        env:
            - key: TOKEN
              valueFrom:
                secretKeyRef:
                    name: example-secret
                    key: password
