apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
    name: with-secret
    namespace: openchoreo-data-plane
spec:
    workloadTemplate:
        containers:
            - name: web
              image: registry.example.com/ws:1
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                        name: example-secret
                        key: password
    environment: dev
    owner:
        project: openchoreo
